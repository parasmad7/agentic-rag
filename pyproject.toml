[project]
name = "agentic-rag"
version = "0.1.0"
description = "Scalable agentic RAG across SQL, NoSQL, and PDF sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "google-auth>=2.0.0",
    "chromadb>=0.6.0",
    "pymongo>=4.0.0",
    "sqlalchemy>=2.0.0",
    "networkx>=3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "reportlab>=4.0",
    "pypdf>=4.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "crewai>=0.1.0",
    "litellm>=1.0.0",
]
