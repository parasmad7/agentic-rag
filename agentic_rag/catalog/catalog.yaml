sources:
  # ── SQL Tables ──────────────────────────────────────────────────
  - id: sql_members
    source_type: sql
    domain: member_management
    name: members
    description: "Gym members with name, contact info, membership type (basic/premium/elite), join date, and status (active/inactive/frozen)"
    key_fields: [name, email, membership_type, join_date, status]
    sample_questions:
      - "How many active members do we have?"
      - "Which members have elite memberships?"
      - "Who joined the gym in 2024?"

  - id: sql_trainers
    source_type: sql
    domain: training
    name: trainers
    description: "Personal trainers with specialization, certification, hire date, and hourly rate"
    key_fields: [name, specialization, certification, hire_date, hourly_rate]
    sample_questions:
      - "Which trainers specialize in HIIT?"
      - "What certifications do our trainers hold?"
      - "What is the average trainer hourly rate?"

  - id: sql_workout_sessions
    source_type: sql
    domain: training
    name: workout_sessions
    description: "Logged workout sessions with member, optional trainer, date, workout type (strength/cardio/HIIT/yoga/pilates), duration, and calories burned"
    key_fields: [member_id, trainer_id, session_date, workout_type, duration_min, calories_burned]
    sample_questions:
      - "How many workout sessions happened in January?"
      - "What is the average calories burned per HIIT session?"
      - "Which members work out the most?"

  - id: sql_memberships
    source_type: sql
    domain: member_management
    name: memberships
    description: "Membership billing records with plan type, start/end dates, monthly fee, and status (active/expired/cancelled)"
    key_fields: [member_id, plan_type, start_date, end_date, monthly_fee, status]
    sample_questions:
      - "How many active memberships are there by plan type?"
      - "What is the total monthly revenue from memberships?"
      - "Which memberships were cancelled?"

  - id: sql_classes
    source_type: sql
    domain: training
    name: classes
    description: "Current group fitness class schedule (not historical — no date column). Has name, assigned trainer, schedule day/time, capacity, current enrollment, and category. For historical class stats or trends by quarter, use the quarterly report PDF instead."
    key_fields: [name, trainer_id, schedule_day, time_slot, max_capacity, current_enrollment, category]
    sample_questions:
      - "Which classes are at full capacity?"
      - "What classes does Derek Washington teach?"
      - "Show all HIIT classes and their current schedules"

  - id: sql_body_metrics
    source_type: sql
    domain: member_management
    name: body_metrics
    description: "Member body composition tracking over time including weight, body fat percentage, BMI, and resting heart rate"
    key_fields: [member_id, recorded_date, weight_kg, body_fat_pct, bmi, resting_heart_rate]
    sample_questions:
      - "Which members are losing weight?"
      - "What is the average BMI of our members?"
      - "Show body metrics progress for Sarah Johnson"

  # ── MongoDB Collections ────────────────────────────────────────
  - id: nosql_nutrition_logs
    source_type: nosql
    domain: nutrition
    name: nutrition_logs
    description: "Daily meal logs with individual meals, calorie/macro breakdowns, water intake, and trainer notes"
    key_fields: [member_name, date, meals, daily_totals, water_liters, notes]
    sample_questions:
      - "What is the average daily calorie intake across members?"
      - "Which members are not meeting protein targets?"
      - "Who has the lowest water intake?"

  - id: nosql_trainer_reviews
    source_type: nosql
    domain: training
    name: trainer_reviews
    description: "Member reviews of personal trainers with ratings, detailed feedback, and review categories"
    key_fields: [trainer_name, member_name, rating, review, categories]
    sample_questions:
      - "What is Marcus Rivera's average rating?"
      - "Which trainers have low ratings?"
      - "What feedback did members give about HIIT classes?"

  - id: nosql_health_assessments
    source_type: nosql
    domain: wellness
    name: health_assessments
    description: "Periodic health assessments with vitals (blood pressure, heart rate, VO2 max), body measurements, goals, recommendations, and risk factors"
    key_fields: [member_name, assessment_date, vitals, measurements, goals, recommendations, risk_factors]
    sample_questions:
      - "Which members have health risk factors?"
      - "What are the common fitness goals?"
      - "Show Sarah Johnson's health assessment progress"

  # ── PDF Documents ──────────────────────────────────────────────
  - id: pdf_safety_guidelines
    source_type: pdf
    domain: wellness
    name: gym_safety_guidelines.pdf
    description: "Gym safety guidelines covering equipment usage rules, trainer responsibilities, injury prevention protocols, class safety, and emergency procedures"
    key_fields: [equipment_rules, trainer_responsibilities, injury_protocols, class_safety, emergency_procedures]
    sample_questions:
      - "What are the rules for using free weights?"
      - "What are trainers responsible for regarding safety?"
      - "What is the emergency procedure for medical incidents?"

  - id: pdf_q1_report
    source_type: pdf
    domain: wellness
    name: q1_2025_fitness_report.pdf
    description: "Q1 2025 quarterly fitness center report with membership growth by plan type, class attendance breakdown by category (HIIT, Yoga, Cardio, Strength, Pilates), trainer performance ratings, member health outcomes, and key risks. Use this for any Q1-specific or time-period questions about classes, membership, or performance."
    key_fields: [membership_growth, class_attendance_by_category, trainer_performance, health_outcomes, risks]
    sample_questions:
      - "How did membership grow in Q1 2025?"
      - "What percentage of classes are HIIT in Q1?"
      - "What are the key risks identified in Q1?"

  - id: pdf_nutrition_guide
    source_type: pdf
    domain: nutrition
    name: nutrition_program_guide.pdf
    description: "Nutrition program guide with macronutrient targets by fitness goal, meal timing, hydration guidelines, supplement recommendations, and logging requirements"
    key_fields: [macro_targets, meal_timing, hydration, supplements, logging_requirements]
    sample_questions:
      - "What protein intake is recommended for muscle building?"
      - "How much water should members drink daily?"
      - "What supplements are recommended?"

domains:
  - name: member_management
    description: "Member data — profiles, memberships, billing, body composition tracking"
  - name: training
    description: "Training operations — trainers, workout sessions, group classes, trainer reviews"
  - name: nutrition
    description: "Nutrition — meal logs, dietary guidelines, macronutrient targets, supplements"
  - name: wellness
    description: "Health & wellness — health assessments, safety guidelines, quarterly fitness reports"
